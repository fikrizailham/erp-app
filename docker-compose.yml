version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: bluma-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bluma
      POSTGRES_PASSWORD: bluma_dev_password
      POSTGRES_DB: bluma_erp
    ports:
      - "5432:5432"
    volumes:
      - bluma_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bluma -d bluma_erp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bluma-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bluma-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://bluma:bluma_dev_password@postgres:5432/bluma_erp?schema=public
      JWT_ACCESS_SECRET: dev_access_secret_change_me
      JWT_REFRESH_SECRET: dev_refresh_secret_change_me
      REDIS_URL: redis://redis:6379
      PORT: 3001
      NODE_ENV: development
    ports:
      - "3001:3001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bluma-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
    ports:
      - "3000:3000"

volumes:
  bluma_pg_data:
